[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phyre-feedback-world-model"
version = "0.1.0"
description = "Memory prefix tokens and execution-feedback diagnostics for PHYRE"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.2"]

[tool.setuptools.packages.find]
include = ["phyre_feedback*"]
